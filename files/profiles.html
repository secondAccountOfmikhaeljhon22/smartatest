<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Profile MindCheck</title>

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            font-family: Arial, sans-serif;
        }

        /* BACK BUTTON */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 2px solid #22c55e;
            background: transparent;
            color: #22c55e;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #22c55e;
            color: white;
        }

        /* CENTER CARD (minimal) */
        .card {
            text-align: center;
        }

        /* AVATAR */
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: auto;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 34px;
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.25);
        }

        /* NAME */
        .name {
            margin-top: 12px;
            font-size: 20px;
            font-weight: bold;
        }

        /* BADGE */
        .badge {
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            color: white;
            font-weight: 600;
        }

        .bronze {
            background: #cd7f32;
        }

        .silver {
            background: #9ca3af;
        }

        .gold {
            background: #fbbf24;
        }

        /* XP */
        .xp {
            margin-top: 18px;
            width: 260px;
        }

        .bar {
            height: 10px;
            background: #e5e7eb;
            border-radius: 999px;
            overflow: hidden;
        }

        .fill {
            height: 100%;
            width: 0%;
            background: #22c55e;
            transition: 0.4s;
        }

        .stats {
            margin-top: 8px;
            font-size: 13px;
            color: #374151;
            display: flex;
            justify-content: space-between;
        }

        /* ICON ROW */
        .icon-row {
            margin-top: 12px;
            display: flex;
            justify-content: center;
            gap: 14px;
            color: #6b7280;
            font-size: 14px;
        }

        .reading {
            margin-top: 16px;
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>

<body>

    <button class="back-btn">
        <i class="fa fa-arrow-left"></i>
        Kembali
    </button>

    <div class="card">

        <div class="avatar">
            <i class="fa fa-user"></i>
        </div>

        <div class="name">Reiner Braun</div>

        <div id="badge" class="badge bronze">
            <i class="fa fa-medal"></i> Bronze Mind
        </div>

        <div class="xp">
            <div class="bar">
                <div class="fill" id="xpBar"></div>
            </div>

            <div class="stats">
                <span><i class="fa fa-bolt"></i> XP: <b id="xp">0</b></span>
                <span>300</span>
            </div>
        </div>

        <div class="icon-row">
            <span><i class="fa fa-book"></i> Reading</span>
            <span><i class="fa fa-chart-line"></i> Leveling</span>
            <span><i class="fa fa-fire"></i> Streak</span>
        </div>

        <div class="reading">
            Sedang membaca artikel (simulasi XP berjalan otomatis)
        </div>

    </div>
    <script>
        let xp = 0;
        const targetXP = 300;

        // total durasi ~5 detik
        const duration = 5000;
        const steps = 50; // makin besar = makin smooth
        const intervalTime = duration / steps;

        // total kenaikan per step
        const increment = targetXP / steps;

        function update() {
            document.getElementById("xp").innerText = Math.floor(xp);

            let percent = (xp / targetXP) * 100;
            if (percent > 100) percent = 100;

            document.getElementById("xpBar").style.width = percent + "%";

            const badge = document.getElementById("badge");

            if (xp >= 200) {
                badge.className = "badge gold";
                badge.innerHTML = '<i class="fa fa-medal"></i> Gold Mind';
            } else if (xp >= 100) {
                badge.className = "badge silver";
                badge.innerHTML = '<i class="fa fa-medal"></i> Silver Mind';
            } else {
                badge.className = "badge bronze";
                badge.innerHTML = '<i class="fa fa-medal"></i> Bronze Mind';
            }
        }

        // animasi XP naik cepat tapi smooth
        let currentStep = 0;

        const timer = setInterval(() => {
            currentStep++;

            // easing biar terasa natural (awal cepat, akhir melambat sedikit)
            const progress = currentStep / steps;
            const eased = 1 - Math.pow(1 - progress, 3);

            xp = eased * targetXP;

            update();

            if (currentStep >= steps) {
                clearInterval(timer);
                xp = targetXP;
                update();
            }

        }, intervalTime);

        update();
    </script>

</body>

</html>
