<!DOCTYPE html>
<html lang="id" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCheck Indonesia — Chat Penuh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --green: #22c55e;
            --green-dark: #16a34a;
            --green-light: #dcfce7;
            --teal: #0d9488;
            --navy: #0f172a;
            --dark: #1e293b;
            --mid: #334155;
            --light: #f8fafc;
            --white: #ffffff;
            --gray: #94a3b8;
            --gray-light: #e2e8f0;
            --danger: #ef4444;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.14);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Fraunces', serif;
        }

        [data-theme="dark"] {
            --navy: #f0f9ff;
            --dark: #e2e8f0;
            --mid: #cbd5e1;
            --light: #0f172a;
            --white: #1e293b;
            --gray-light: #334155;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: var(--light);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-full-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            background: var(--white);
            box-shadow: var(--shadow-lg);
        }

        .chat-header {
            padding: 12px 1.2rem;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--white);
            border-bottom: 1px solid var(--gray-light);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
            position: relative;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            flex-shrink: 0;
        }

        .chat-header-info {
            flex: 1;
        }

        .chat-header-info h4 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--navy);
        }

        .chat-header-info span {
            font-size: 0.75rem;
            color: var(--green);
            font-weight: 600;
        }

        .chat-header-actions {
            display: flex;
            gap: 8px;
            position: relative;
        }

        .chat-header-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gray-light);
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all var(--transition);
        }

        .chat-header-btn:hover {
            background: var(--green-light);
        }

        .dropdown-menu {
            position: absolute;
            top: 40px;
            right: 0;
            background: var(--white);
            border: 1px solid var(--gray-light);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            min-width: 250px;
            z-index: 10;
            display: none;
            overflow: hidden;
        }

        .dropdown-menu.show {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        .dropdown-menu-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--dark);
            transition: background var(--transition);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .dropdown-menu-item:hover {
            background: var(--green-light);
            color: var(--green-dark);
        }

        .dropdown-menu-item i {
            width: 18px;
            color: var(--green);
        }

        .dropdown-menu-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .dropdown-menu-item .badge {
            margin-left: auto;
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .badge-active {
            background: #dcfce7;
            color: #166534;
        }

        .dropdown-divider {
            height: 1px;
            background: var(--gray-light);
            margin: 4px 0;
        }

        .consultation-banner {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            padding: 10px 1.2rem;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .consultation-banner .timer {
            font-weight: 800;
            font-size: 1rem;
            margin-left: auto;
        }

        .consultation-banner .deadline {
            font-size: 0.75rem;
            opacity: 0.9;
            margin-left: 8px;
        }

        .consultation-banner .btn-end {
            margin-left: 12px;
            padding: 6px 14px;
            background: white;
            color: var(--danger);
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: var(--white);
            border-radius: var(--radius);
            padding: 2rem;
            width: 500px;
            max-width: 90vw;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        .modal h3 {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--navy);
            margin-bottom: 1rem;
        }

        .modal label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 4px;
        }

        .modal input,
        .modal select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--gray-light);
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            font-family: var(--font);
            color: var(--dark);
            background: var(--light);
            outline: none;
            margin-bottom: 12px;
            transition: border var(--transition);
        }

        .modal input:focus,
        .modal select:focus {
            border-color: var(--green);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--green), var(--teal));
            color: white;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-close-modal {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--gray-light);
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
        }

        .pricing-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 16px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 2px solid var(--gray-light);
        }

        .pricing-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.88rem;
            background: var(--light);
            color: var(--gray);
            transition: all var(--transition);
            border: none;
        }

        .pricing-tab.active {
            background: var(--green);
            color: white;
        }

        .pricing-tab:not(:last-child) {
            border-right: 2px solid var(--gray-light);
        }

        .price-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .price-input-group input {
            width: 80px;
            text-align: center;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0;
        }

        .price-input-group span {
            font-size: 0.85rem;
            color: var(--gray);
            font-weight: 600;
        }

        .price-preview {
            text-align: center;
            padding: 14px;
            background: var(--green-light);
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
        }

        .price-preview .total {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--green-dark);
        }

        .price-preview .detail {
            font-size: 0.78rem;
            color: var(--gray);
            margin-top: 4px;
        }

        /* Payment Flow Container */
        .payment-container {
            display: none;
            text-align: center;
            padding: 1rem 0;
        }

        .payment-container.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .payment-step {
            margin-bottom: 1.5rem;
        }

        .payment-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.8rem;
            animation: float 2s ease-in-out infinite;
        }

        .payment-info {
            background: var(--gray-light);
            border-radius: var(--radius-sm);
            padding: 16px;
            text-align: left;
            margin-bottom: 1rem;
        }

        .payment-info .info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--gray-light);
        }

        .payment-info .info-row:last-child {
            border-bottom: none;
        }

        .payment-info .info-row .label {
            color: var(--gray);
        }

        .payment-info .info-row .value {
            font-weight: 700;
            color: var(--navy);
        }

        .payment-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .payment-status.waiting {
            background: #fef3c7;
            color: #92400e;
        }

        .payment-status.processing {
            background: #dbeafe;
            color: #1e40af;
        }

        .payment-status.success {
            background: #dcfce7;
            color: #166534;
        }

        .payment-status.failed {
            background: #fee2e2;
            color: #991b1b;
        }

        .qr-placeholder {
            width: 180px;
            height: 180px;
            background: white;
            margin: 0 auto 1rem;
            border: 3px dashed var(--gray-light);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: var(--gray);
        }

        .btn-back-payment {
            width: 100%;
            padding: 10px;
            background: var(--gray-light);
            color: var(--mid);
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
        }

        .btn-back-payment:hover {
            background: #cbd5e1;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--light);
        }

        .msg-row {
            display: flex;
            gap: 8px;
            max-width: 75%;
            animation: fadeIn 0.2s ease;
        }

        .msg-row.sent {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-row.received {
            align-self: flex-start;
        }

        .msg-avatar-small {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: white;
            flex-shrink: 0;
            align-self: flex-end;
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.5;
            max-width: 100%;
            word-break: break-word;
        }

        .msg-row.sent .msg-bubble {
            background: linear-gradient(135deg, var(--green), var(--teal));
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg-row.received .msg-bubble {
            background: var(--white);
            color: var(--dark);
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }

        .msg-time {
            font-size: 0.68rem;
            color: var(--gray);
            margin-top: 3px;
            padding: 0 4px;
            text-align: right;
        }

        .msg-row.received .msg-time {
            text-align: left;
        }

        .msg-system {
            text-align: center;
            font-size: 0.75rem;
            color: var(--gray);
            padding: 6px 14px;
            background: var(--gray-light);
            border-radius: 50px;
            align-self: center;
            max-width: 80%;
        }

        .chat-input-bar {
            padding: 12px 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--white);
            border-top: 1px solid var(--gray-light);
            flex-shrink: 0;
        }

        .chat-input-bar input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid var(--gray-light);
            border-radius: 50px;
            font-family: var(--font);
            font-size: 0.9rem;
            color: var(--dark);
            background: var(--light);
            outline: none;
            transition: border var(--transition);
        }

        .chat-input-bar input:focus {
            border-color: var(--green);
        }

        .chat-send {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--green);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            transition: all var(--transition);
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.3);
            border: none;
            cursor: pointer;
        }

        .chat-send:hover {
            background: var(--green-dark);
            transform: scale(1.08);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(120%);
            background: var(--navy);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: var(--green-dark);
        }

        .toast.error {
            background: var(--danger);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .msg-row {
                max-width: 85%;
            }

            .chat-full-container {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="chat-full-container">
        <div class="chat-header" id="chatHeader">
            <div class="chat-avatar" id="chatAvatar">👩‍⚕️</div>
            <div class="chat-header-info">
                <h4 id="chatName">Dr. Ratna Dewi, Sp.KJ</h4>
                <span id="chatStatus">Online</span>
            </div>
            <div class="chat-header-actions">
                <button class="chat-header-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
                <button class="chat-header-btn" onclick="toggleDropdown()" id="dropdownBtn"><i
                        class="fa-solid fa-ellipsis-vertical"></i></button>
<div class="dropdown-menu" id="dropdownMenu">

    <button class="dropdown-menu-item" onclick="startSessionDemo()">
        <i class="fa fa-play"></i> Mulai Sesi (Demo)
    </button>

    <button class="dropdown-menu-item" onclick="openPaymentFlow()">

</div>            </div>

    <script>
        // ==================== STATE ====================
        const urlParams = new URLSearchParams(window.location.search);
        const doctorId = urlParams.get('dokter');
        const allDoctors = JSON.parse(localStorage.getItem('mindcheck_all_doctors') || '[]');
        const doctor = allDoctors.find(d => d.id == doctorId);

        let chatMessages = [];
        let ws = null;
        let wsReconnectTimer = null;

        let consultationActive = false;
        let consultationTimer = null;
        let consultationSeconds = 0;
        let consultationDeadline = null;

        let pricingMode = 'hourly';
        let paymentProcessing = false;

        const HOURLY_RATE = 150000;
        const DAILY_RATE = 500000;

        // ==================== DEDUP SYSTEM ====================
        const processedMessageIds = new Set();

        function generateMessageId() {
            return Date.now().toString(36) + Math.random().toString(36).substring(2, 10);
        }

        function getTimeNow() {
            return new Date().toTimeString().slice(0, 5);
        }

        // ==================== INIT ====================
        function initChat() {
            if (!doctor) {
                document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;">
                <h2>Dokter tidak ditemukan</h2>
            </div>`;
                return;
            }

            connectWebSocket();
            renderMessages();

            document.getElementById('chatInput').focus();

            window.addEventListener('beforeunload', () => {
                disconnectWebSocket();
            });
        }

        // ==================== WEBSOCKET ====================
        function connectWebSocket() {
            ws = new WebSocket('ws://localhost:5050/ws');

            ws.onopen = () => {
                console.log('WS CONNECTED');

                ws.send(JSON.stringify({
                    type: 'join',
                    role: 'user',
                    doctorId
                }));
            };

            ws.onmessage = (event) => {
                let data;

                try {
                    data = JSON.parse(event.data);
                } catch {
                    data = event.data;
                }

                handleIncomingMessage(data);
            };

            ws.onclose = () => {
                ws = null;
                wsReconnectTimer = setTimeout(connectWebSocket, 3000);
            };
        }

        function disconnectWebSocket() {
            if (ws) ws.close();
            if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
        }

        // ==================== HANDLE INCOMING ====================
        function handleIncomingMessage(payload) {
            let text = null;
            let messageId = null;

            if (typeof payload === 'string') {
                text = payload;
            } else {
                text =
                    payload?.data?.data?.text ||
                    payload?.data?.text ||
                    payload?.message ||
                    payload?.text;

                messageId =
                    payload?.data?.data?.messageId ||
                    payload?.data?.messageId ||
                    payload?.messageId;
            }

            if (!text) return;

            // ================== 🔥 FILTER LOG SYSTEM ==================
            const blockedKeywords = [
                'client connected',
                'connected',
                'disconnected',
                'message received',
                'joined',
                'left',
                'room',
                'subscribe',
                'ws:',
                'error:',
                'ping',
                'pong'
            ];

            const lower = text.toLowerCase();

            if (blockedKeywords.some(k => lower.includes(k))) return;

            // optional tambahan safety
            if (text.length < 2) return;

            // ================== DEDUP ==================
            if (messageId) {
                if (processedMessageIds.has(messageId)) return;
                processedMessageIds.add(messageId);
            } else {
                if (processedMessageIds.has(text)) return;
                processedMessageIds.add(text);
            }

            chatMessages.push({
                type: 'received',
                text,
                time: getTimeNow(),
                messageId
            });

            renderMessages();
        }
        function processIncomingPayload(data) {
            let text =
                data?.data?.data?.text ||
                data?.data?.text ||
                data?.message ||
                data?.text;

            if (!text) return;

            // ❌ FIX: hard filter noisy backend logs
            const blockedKeywords = [
                'client connected',
                'connected',
                'disconnected',
                'message received',
                'joined',
                'left',
                'room',
                'subscribe',
                'ws:',
                'error:',
                'ping',
                'pong'
            ];

            const lower = text.toLowerCase();

            if (blockedKeywords.some(k => lower.includes(k))) return;

            if (isSystemMessage(text)) return;

            const messageId =
                data?.data?.data?.messageId ||
                data?.data?.messageId ||
                data?.messageId;

            if (messageId) {
                if (processedMessageIds.has(messageId)) return;
                processedMessageIds.add(messageId);
            } else {
                if (processedMessageIds.has(text)) return;
                processedMessageIds.add(text);
            }

            addMessageToUI('received', text);
        }

        // ==================== SEND MESSAGE ====================
        function sendMessage() {
            const input = document.getElementById('chatInput');
            if (!input.value.trim()) return;

            const text = input.value.trim();
            input.value = '';

            const messageId = generateMessageId();
            const timestamp = Math.floor(Date.now() / 1000);

            // mark as processed immediately (anti echo WS)
            processedMessageIds.add(messageId);

            chatMessages.push({
                type: 'sent',
                text,
                time: getTimeNow(),
                messageId
            });

            renderMessages();

            // ================= WS =================
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'chat',
                    senderRole: 'user',
                    doctorId,
                    messageId,
                    message: text,
                    timestamp,
                    data: {
                        text,
                        messageId,
                        senderName: 'User'
                    }
                }));
            }

            // ================= HTTP =================
            sendViaHttp(text, timestamp, messageId);
        }

        async function sendViaHttp(text, timestamp, messageId) {
            try {
                await fetch('http://localhost:5050/send-notif', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'chat',
                        messageId,
                        message: text,
                        data: {
                            doctorId,
                            text,
                            timestamp
                        }
                    })
                });
            } catch (e) {
                console.warn('HTTP failed');
            }
        }

        // ==================== UI ====================
        function renderMessages() {
            const container = document.getElementById('chatMessagesContainer');
            if (!container) return;

            container.innerHTML = chatMessages.map(msg => {
                if (msg.type === 'system') {
                    return `<div class="msg-system">${msg.text}</div>`;
                }

                return `
                <div class="msg-row ${msg.type}">
                    <div>
                        <div class="msg-bubble">${msg.text}</div>
                        <div class="msg-time">${msg.time || ''}</div>
                    </div>
                </div>
            `;
            }).join('');

            container.scrollTop = container.scrollHeight;
        }

        // ==================== INIT ====================
        document.addEventListener('DOMContentLoaded', initChat);
    </script>
</body>
