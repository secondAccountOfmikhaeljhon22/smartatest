<!DOCTYPE html>
<html lang="id" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCheck Indonesia — Chat Pasien</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --green: #22c55e;
            --green-dark: #16a34a;
            --green-light: #dcfce7;
            --teal: #0d9488;
            --navy: #0f172a;
            --dark: #1e293b;
            --mid: #334155;
            --light: #f8fafc;
            --white: #ffffff;
            --gray: #94a3b8;
            --gray-light: #e2e8f0;
            --danger: #ef4444;
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.12);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Plus Jakarta Sans', sans-serif;
        }

        [data-theme="dark"] {
            --navy: #f0f9ff;
            --dark: #e2e8f0;
            --light: #0f172a;
            --white: #1e293b;
            --gray-light: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: var(--light);
            height: 100vh;
            display: flex;
            justify-content: center;
        }

        .chat-full-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 900px;
            width: 100%;
            background: var(--white);
            box-shadow: var(--shadow-lg);
        }

        .chat-header {
            padding: 12px 1.2rem;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--gray-light);
            flex-shrink: 0;
        }

        .chat-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            background: var(--green);
        }

        .chat-header-info {
            flex: 1;
        }

        .chat-header-info h4 {
            font-size: 1rem;
            color: var(--navy);
        }

        .chat-header-info span {
            font-size: 0.75rem;
            color: var(--green);
            font-weight: 700;
        }

        .ws-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 800;
            background: var(--gray-light);
            color: var(--gray);
        }

        .ws-indicator.connected {
            background: var(--green-light);
            color: var(--green-dark);
        }

        .ws-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--light);
        }

        .msg-row {
            display: flex;
            gap: 10px;
            max-width: 80%;
            animation: slideUp 0.3s ease;
        }

        .msg-row.sent {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-row.received {
            align-self: flex-start;
        }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .sent .msg-bubble {
            background: linear-gradient(135deg, var(--green), var(--teal));
            color: white;
            border-bottom-right-radius: 4px;
        }

        .received .msg-bubble {
            background: var(--white);
            color: var(--dark);
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .msg-time {
            font-size: 0.65rem;
            color: var(--gray);
            margin-top: 4px;
            padding: 0 5px;
        }

        .sent .msg-time {
            text-align: right;
        }

        .msg-system {
            align-self: center;
            background: var(--gray-light);
            color: var(--mid);
            padding: 4px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin: 10px 0;
        }

        .chat-input-bar {
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--gray-light);
        }

        .chat-input-bar input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 30px;
            border: 2px solid var(--gray-light);
            outline: none;
            font-family: inherit;
            transition: var(--transition);
        }

        .chat-input-bar input:focus {
            border-color: var(--green);
        }

        .btn-send {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--green);
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-send:hover {
            transform: scale(1.1);
            background: var(--green-dark);
        }

        .debug-panel {
            background: #000;
            color: #0f0;
            font-family: monospace;
            font-size: 0.7rem;
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
            display: none;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="chat-full-container">
        <div class="chat-header">
            <div class="chat-avatar" id="patientAvatar">👤</div>
            <div class="chat-header-info">
                <h4 id="patientName">Memuat...</h4>
                <span id="patientStatus">Menghubungkan...</span>
            </div>
            <div class="ws-indicator" id="wsIndicator">
                <div class="ws-dot"></div>
                <span id="wsLabel">Offline</span>
            </div>
            <button class="btn-icon" onclick="toggleDebug()"
                style="background:none; border:none; cursor:pointer; color:var(--gray)">
                <i class="fa-solid fa-bug"></i>
            </button>
        </div>

        <div class="debug-panel" id="debugPanel"></div>

        <div class="chat-messages" id="chatMessagesContainer">

        </div>

        <div class="chat-input-bar">
            <input type="text" id="chatInput" placeholder="Tulis pesan untuk pasien..." autocomplete="off">
            <button class="btn-send" onclick="handleSendMessage()">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>
    <script>
        const WS_URL = 'ws://localhost:5050/ws';

        const urlParams = new URLSearchParams(window.location.search);
        const doctorId = urlParams.get('dokter');

        const allDoctors = JSON.parse(localStorage.getItem('mindcheck_all_doctors') || '[]');
        const doctor = allDoctors.find(d => d.id == doctorId);

        const PATIENT_DATA = {
            id: 1,
            name: "Andriani Patani",
            avatar: "👤",
            color: "linear-gradient(135deg, #6366f1, #a855f7)"
        };

        let ws = null;

        const processedMessageIds = new Set();

        function generateMessageId(payload, direction = 'in') {
            const base = payload?.messageId
                || payload?.id
                || payload?.timestamp
                || payload?.data?.timestamp
                || (payload?.text || payload?.message || '') + direction;

            return btoa(unescape(encodeURIComponent(String(base))));
        }

        function isSystemMessage(text = '') {
            const lower = text.toLowerCase();
            return [
                'connected',
                'disconnected',
                'client',
                'joined',
                'left',
                'subscribed',
                'message received',
                'ws:',
                'room'
            ].some(k => lower.includes(k));
        }

        function init() {
            document.getElementById('patientName').textContent = PATIENT_DATA.name;
            document.getElementById('patientAvatar').style.background = PATIENT_DATA.color;

            updateWsUI('offline', 'Offline');

            initWebSocket();

            document.getElementById('chatInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSendMessage();
            });
        }

        function initWebSocket() {
            ws = new WebSocket(WS_URL);

            updateWsUI('offline', 'Menghubungkan...');

            ws.onopen = () => {
                updateWsUI('connected', 'Online');

                ws.send(JSON.stringify({
                    type: 'join',
                    senderRole: 'doctor',
                    patientId: PATIENT_DATA.id
                }));
            };

            ws.onclose = () => {
                updateWsUI('offline', 'Offline');
                setTimeout(initWebSocket, 3000);
            };

            ws.onerror = () => {
                updateWsUI('offline', 'Error');
            };

            ws.onmessage = (event) => {
                let data = event.data;

                try {
                    if (typeof data === 'string') {
                        data = JSON.parse(data);
                        if (typeof data === 'string') {
                            data = JSON.parse(data);
                        }
                    }
                } catch {
                    data = { text: event.data };
                }

                processIncomingPayload(data);
            };
        }

        function updateWsUI(state, label) {
            const el = document.getElementById('wsIndicator');
            const lb = document.getElementById('wsLabel');
            const status = document.getElementById('patientStatus');

            el.className = 'ws-indicator ' + state;
            lb.textContent = label;

            if (status) status.textContent = label;
        }

        function processIncomingPayload(data) {
            let text =
                data?.data?.data?.text ||
                data?.data?.text ||
                data?.message ||
                data?.text;

            if (!text) return;

            if (isSystemMessage(text)) return;

            const messageId =
                data?.data?.data?.messageId ||
                data?.data?.messageId ||
                data?.messageId;

            if (messageId) {
                if (processedMessageIds.has(messageId)) return;
                processedMessageIds.add(messageId);
            } else {
                if (processedMessageIds.has(text)) return;
                processedMessageIds.add(text);
            }

            addMessageToUI('received', text);
        }

        function handleSendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            const timestamp = Date.now();
            const messageId = generateMessageId({ text, timestamp }, 'out');

            processedMessageIds.add(messageId);

            addMessageToUI('sent', text);

            const payload = {
                type: 'chat',
                senderRole: 'doctor',
                senderId: 'self',
                patientId: PATIENT_DATA.id,
                messageId,
                message: text,
                timestamp,
                data: {
                    text,
                    senderId: 'self',
                    senderName: 'Doctor'
                }
            };

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(payload));
            }

            sendViaHttp(text, timestamp);

            input.value = '';
            input.focus();
        }

        async function sendViaHttp(text, timestamp) {
            try {
                await fetch('http://localhost:5050/send-notif', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'chat',
                        event: 'new_message',
                        message: text,
                        data: {
                            senderId: 'doctor',
                            patientId: PATIENT_DATA.id,
                            text,
                            timestamp
                        }
                    })
                });
            } catch (e) { }
        }

        function addMessageToUI(type, text) {
            const container = document.getElementById('chatMessagesContainer');
            const time = new Date().toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit'
            });

            const html = `
        <div class="msg-row ${type}">
            ${type === 'received'
                    ? `<div class="chat-avatar" style="width:30px;height:30px;font-size:0.8rem;background:${PATIENT_DATA.color}">
                        ${PATIENT_DATA.avatar}
                    </div>`
                    : ''
                }
            <div>
                <div class="msg-bubble">${escapeHtml(text)}</div>
                <div class="msg-time">${time}</div>
            </div>
        </div>
        `;

            container.insertAdjacentHTML('beforeend', html);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        init();
    </script>
</body>

</html>
