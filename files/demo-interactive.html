<!DOCTYPE html>
<html lang="id" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCheck Indonesia — Chat Demo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --green: #22c55e;
            --green-dark: #16a34a;
            --green-light: #dcfce7;
            --dark: #1e293b;
            --light: #f8fafc;
            --white: #fff;
            --gray: #94a3b8;
            --gray-light: #e2e8f0;
            --shadow: 0 8px 30px rgba(0,0,0,0.12);
            --radius: 16px;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: Arial;
            background: var(--light);
            height: 100vh;
            display:flex;
            justify-content:center;
        }

        .app {
            width:100%;
            max-width:900px;
            background:var(--white);
            display:flex;
            flex-direction:column;
            height:100vh;
        }

        .header {
            padding:12px 16px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px solid var(--gray-light);
        }

        .header-left {
            display:flex;
            gap:10px;
            align-items:center;
        }

        .avatar {
            width:40px;
            height:40px;
            border-radius:50%;
            background:var(--green);
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
        }

        .menu {
            position:relative;
        }

        .menu-btn {
            background:transparent;
            border:none;
            font-size:18px;
            cursor:pointer;
        }

        .dropdown {
            position:absolute;
            right:0;
            top:40px;
            width:220px;
            background:white;
            box-shadow:var(--shadow);
            border-radius:10px;
            display:none;
            overflow:hidden;
            z-index:30;
        }

        .dropdown.show { display:block; }

        .item {
            padding:12px;
            cursor:pointer;
            display:flex;
            gap:10px;
            align-items:center;
        }

        .item:hover { background:var(--green-light); }

        .chat {
            flex:1;
            padding:12px;
            overflow:auto;
            background:#f9fafb;
        }

        .msg {
            padding:10px 14px;
            margin:6px 0;
            max-width:70%;
            border-radius:14px;
        }

        .me {
            background:var(--green);
            color:white;
            margin-left:auto;
        }

        .input-bar {
            display:flex;
            gap:10px;
            padding:10px;
            border-top:1px solid var(--gray-light);
        }

        input {
            flex:1;
            padding:10px;
            border-radius:20px;
            border:1px solid var(--gray-light);
        }

        button.send {
            background:var(--green);
            border:none;
            color:white;
            width:40px;
            border-radius:50%;
        }

        .overlay {
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.5);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:50;
        }

        .overlay.show { display:flex; }

        .modal {
            width:420px;
            background:white;
            border-radius:var(--radius);
            padding:20px;
            max-width:90vw;
        }

        .btn {
            width:100%;
            padding:10px;
            background:var(--green);
            color:white;
            border:none;
            border-radius:20px;
            margin-top:10px;
            cursor:pointer;
        }

        .center {
            text-align:center;
            padding:20px;
        }

        .spinner {
            font-size:30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform:rotate(360deg); }
        }

        .check {
            font-size:40px;
            color:var(--green);
        }

        .banner {
            display:none;
            padding:10px;
            background:var(--green);
            color:white;
            text-align:center;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="app">

    
    <div class="header">
        <div class="header-left">
            <div class="avatar"><i class="fa fa-user-md"></i></div>
            <div>
                <div><b>Dr. Demo</b></div>
                <small>Online</small>
            </div>
        </div>

        <div class="menu">
            <button class="menu-btn" onclick="toggleMenu()">
                <i class="fa fa-ellipsis-vertical"></i>
            </button>

            <div class="dropdown" id="dropdown">
                <div class="item" onclick="openPayment()">
                    <i class="fa fa-credit-card"></i> Mulai Sesi Serius
                </div>
                <div class="item" onclick="openOffline()">
                    <i class="fa fa-calendar"></i> Jadwal Offline
                </div>
            </div>
        </div>
    </div>

    
    <div class="banner" id="banner">
        Sesi Aktif - <span id="timer">00:00:00</span>
    </div>

    
    <div class="chat" id="chat"></div>

    
    <div class="input-bar">
        <input id="input" placeholder="Ketik pesan...">
        <button class="send" onclick="send()"><i class="fa fa-paper-plane"></i></button>
    </div>

</div>


<div class="overlay" id="payModal">
    <div class="modal" id="payContent">
        <h3>Mulai Sesi Serius</h3>

        <label>Durasi (jam)</label>
        <input type="number" id="hour" value="1" min="1" oninput="calc()">

        <div><b>Total: </b><span id="price">Rp 150.000</span></div>

        <button class="btn" onclick="pay()">Bayar & Mulai</button>
    </div>
</div>


<div class="overlay" id="offModal">
    <div class="modal">
        <h3>Jadwal Offline</h3>

        <input id="date" type="date">
        <input id="time" type="time">

        <button class="btn" onclick="sendOffline()">Kirim Permintaan</button>
    </div>
</div>

<script>
let chat = document.getElementById("chat");
let priceBase = 150000;
let sessionSeconds = 0;
let timer;

function toggleMenu(){
    document.getElementById("dropdown").classList.toggle("show");
}

function send(){
    let i = document.getElementById("input");
    if(!i.value) return;

    chat.innerHTML += `<div class="msg me">${i.value}</div>`;
    i.value="";
    chat.scrollTop = chat.scrollHeight;
}

function openPayment(){
    document.getElementById("payModal").classList.add("show");
}

function calc(){
    let h = document.getElementById("hour").value;
    document.getElementById("price").innerText = "Rp " + (h * priceBase).toLocaleString();
}

function pay(){
    document.getElementById("payContent").innerHTML = `
        <div class="center">
            <i class="fa fa-spinner spinner"></i>
            <p>Memproses pembayaran...</p>
        </div>
    `;

    setTimeout(()=>{
        document.getElementById("payContent").innerHTML = `
            <div class="center">
                <i class="fa fa-check-circle check"></i>
                <p>Pembayaran berhasil</p>
            </div>
        `;

        startSession();
    },2000);
}

function startSession(){
    document.getElementById("payModal").classList.remove("show");
    document.getElementById("banner").style.display="block";

    timer = setInterval(()=>{
        sessionSeconds++;
        let h = String(Math.floor(sessionSeconds/3600)).padStart(2,'0');
        let m = String(Math.floor(sessionSeconds%3600/60)).padStart(2,'0');
        let s = String(sessionSeconds%60).padStart(2,'0');
        document.getElementById("timer").innerText = `${h}:${m}:${s}`;
    },1000);
}

function openOffline(){
    document.getElementById("offModal").classList.add("show");
}

function sendOffline(){
    let d = document.getElementById("date").value;
    let t = document.getElementById("time").value;

    chat.innerHTML += `<div class="msg me">
        Permintaan offline: ${d} ${t}
    </div>`;

    document.getElementById("offModal").classList.remove("show");
}

</script>

</body>
</html>
