<!DOCTYPE html>
<html lang="id" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCheck Indonesia — Matchmaking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --green: #22c55e;
            --green-dark: #16a34a;
            --green-light: #dcfce7;
            --teal: #0d9488;
            --navy: #0f172a;
            --dark: #1e293b;
            --mid: #334155;
            --light: #f8fafc;
            --white: #ffffff;
            --gray: #94a3b8;
            --gray-light: #e2e8f0;
            --danger: #ef4444;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.14);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Fraunces', serif;
        }

        [data-theme="dark"] {
            --navy: #f0f9ff;
            --dark: #e2e8f0;
            --mid: #cbd5e1;
            --light: #0f172a;
            --white: #1e293b;
            --gray-light: #334155;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            scroll-behavior: smooth
        }

        body {
            font-family: var(--font);
            background: var(--light);
            color: var(--dark);
            min-height: 100vh;
            transition: background var(--transition), color var(--transition)
        }

        a {
            text-decoration: none;
            color: var(--green-dark)
        }

        input,
        button {
            font-family: var(--font)
        }

        button {
            cursor: pointer;
            border: none
        }

        .hidden {
            display: none !important
        }

        /* NAVBAR */
        .nav-menu {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-link {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--mid);
            text-decoration: none;
            position: relative;
            transition: var(--transition);
        }

        .nav-link:hover {
            color: var(--green-dark);
        }

        .nav-link::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 0%;
            height: 2px;
            background: var(--green);
            transition: var(--transition);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            height: 70px;
            background: var(--white);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--navy);
            text-decoration: none;
        }

        .nav-right {
            position: relative;
            cursor: pointer;
        }

        .nav-bell {
            font-size: 1.4rem;
            color: var(--mid);
        }

        .btn-login {
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: .88rem;
            background: transparent;
            border: 2px solid var(--green);
            color: var(--green-dark);
            transition: all var(--transition)
        }

        .btn-login:hover {
            background: var(--green-light)
        }

        .btn-register {
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: .88rem;
            background: var(--green);
            color: var(--white);
            transition: all var(--transition);
            box-shadow: 0 2px 12px rgba(34, 197, 94, .3)
        }

        .btn-register:hover {
            background: var(--green-dark);
            transform: translateY(-1px)
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 299;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition)
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all
        }

        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%) scale(0.95);
            background: var(--white);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            width: 420px;
            max-width: 95vw;
            max-height: 90vh;
            overflow-y: auto;
            z-index: 300;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            pointer-events: none;
            transition: all var(--transition)
        }

        .modal.active {
            opacity: 1;
            pointer-events: all;
            transform: translate(-50%, -50%) scale(1)
        }

        .modal.wide {
            width: 680px
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gray-light);
            color: var(--dark);
            font-size: .9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition);
            z-index: 5
        }

        .modal-close:hover {
            background: var(--green-light)
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(120%);
            background: var(--navy);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: .9rem;
            font-weight: 600;
            z-index: 9999;
            transition: transform .4s cubic-bezier(.4, 0, .2, 1);
            white-space: nowrap
        }

        .toast.show {
            transform: translateX(-50%) translateY(0)
        }

        .toast.success {
            background: var(--green-dark)
        }

        .toast.error {
            background: var(--danger)
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-10px)
            }
        }

        @keyframes mmPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: .7
            }

            50% {
                transform: scale(1.2);
                opacity: .3
            }
        }

        .start-matchmaking {
            margin: 0;
            padding: 2.5rem 2rem;
            background: linear-gradient(135deg, #0f172a 0%, #134e4a 60%, #0d9488 100%);
            border-radius: 0 0 24px 24px;
            text-align: center;
            position: relative;
            overflow: hidden
        }

        .start-matchmaking::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%2322c55e' fill-opacity='0.07'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            pointer-events: none
        }

        .sm-icon {
            font-size: 2.8rem;
            margin-bottom: .8rem;
            display: block;
            animation: float 3s ease-in-out infinite;
            position: relative;
            z-index: 1
        }

        .start-matchmaking h3 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: .6rem;
            position: relative;
            z-index: 1;
            line-height: 1.3
        }

        .start-matchmaking p {
            font-size: .88rem;
            color: rgba(255, 255, 255, .72);
            line-height: 1.6;
            max-width: 380px;
            margin: 0 auto 1.6rem;
            position: relative;
            z-index: 1
        }

        .sm-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
            margin-bottom: 1.2rem
        }

        .btn-sm-primary {
            padding: 13px 26px;
            background: var(--green);
            color: #fff;
            border-radius: 50px;
            font-weight: 800;
            font-size: .95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition);
            box-shadow: 0 4px 20px rgba(34, 197, 94, .45)
        }

        .btn-sm-primary:hover {
            background: #16a34a;
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(34, 197, 94, .55)
        }

        .btn-sm-secondary {
            padding: 13px 26px;
            background: transparent;
            color: #fff;
            border-radius: 50px;
            font-weight: 700;
            font-size: .95rem;
            border: 2px solid rgba(255, 255, 255, .35);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition)
        }

        .btn-sm-secondary:hover {
            background: rgba(255, 255, 255, .12);
            border-color: rgba(255, 255, 255, .6);
            transform: translateY(-2px)
        }

        .sm-trust {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1
        }

        .sm-trust span {
            font-size: .78rem;
            font-weight: 700;
            color: rgba(255, 255, 255, .6);
            letter-spacing: .3px
        }

        .mm-modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding: 0 0 1rem;
            border-bottom: 1px solid var(--gray-light);
            margin-bottom: 1rem
        }

        .mm-modal-header h3 {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--navy)
        }

        .mm-modal-header p {
            font-size: .8rem;
            color: var(--gray);
            margin-top: 2px
        }

        .mm-pref-overlay {
            text-align: center;
            padding: .5rem 0
        }

        .mm-pref-overlay .pref-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: .6rem;
            animation: float 3s ease-in-out infinite
        }

        .mm-pref-overlay h4 {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--navy);
            margin-bottom: .4rem
        }

        .mm-pref-overlay>p {
            font-size: .82rem;
            color: var(--gray);
            margin-bottom: 1.2rem;
            line-height: 1.5
        }

        .mm-pref-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .btn-pref {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: .93rem;
            border: 2px solid var(--gray-light);
            background: var(--white);
            color: var(--dark);
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left
        }

        .btn-pref:hover {
            border-color: var(--green);
            background: var(--green-light);
            transform: translateX(2px)
        }

        .btn-pref.recommend {
            border-color: var(--green);
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            color: var(--green-dark);
            box-shadow: 0 2px 12px rgba(34, 197, 94, .15)
        }

        .btn-pref .pref-btn-icon {
            font-size: 1.5rem;
            width: 40px;
            text-align: center;
            flex-shrink: 0
        }

        .btn-pref .pref-btn-info {
            flex: 1
        }

        .btn-pref .pref-btn-info strong {
            display: block;
            font-size: .9rem
        }

        .btn-pref .pref-btn-info small {
            font-size: .74rem;
            color: var(--gray);
            font-weight: 500
        }

        .mm-loading {
            padding: 1.5rem 0;
            text-align: center
        }

        .mm-loading-anim {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .mm-pulse {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--green-light);
            animation: mmPulse 1.4s ease-in-out infinite
        }

        .mm-loading-anim span {
            font-size: 2.2rem;
            position: relative;
            z-index: 1
        }

        .mm-loading h4 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 1rem
        }

        .mm-loading-steps {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 260px;
            margin: 0 auto
        }

        .mm-step {
            font-size: .82rem;
            font-weight: 600;
            color: var(--gray);
            padding: 8px 14px;
            background: var(--light);
            border-radius: 50px;
            border: 2px solid var(--gray-light);
            transition: all .5s ease;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .mm-step.active {
            color: var(--green-dark);
            background: var(--green-light);
            border-color: var(--green)
        }

        .mm-step.done {
            color: var(--green-dark);
            background: var(--green-light);
            border-color: var(--green);
            opacity: .8
        }

        .mm-step i {
            font-size: .85rem
        }

        .mm-result {
            max-height: 60vh;
            overflow-y: auto
        }

        .mm-reason {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin: 0 0 1rem;
            font-size: .83rem;
            color: #92400e;
            line-height: 1.55
        }

        .mm-reason-icon {
            font-size: 1.1rem;
            flex-shrink: 0
        }

        .mm-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: .8rem
        }

        .mm-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 1rem;
            border: 2px solid var(--gray-light);
            border-radius: var(--radius);
            background: var(--light);
            position: relative;
            transition: all var(--transition);
            cursor: pointer
        }

        .mm-card:hover {
            border-color: var(--green);
            background: var(--green-light);
            transform: translateX(2px)
        }

        .mm-card.top-match {
            border-color: var(--green);
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            box-shadow: 0 4px 16px rgba(34, 197, 94, .18)
        }

        .mm-top-badge {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, var(--green), var(--teal));
            color: white;
            font-size: .7rem;
            font-weight: 800;
            padding: 3px 14px;
            border-radius: 50px;
            white-space: nowrap;
            letter-spacing: .4px
        }

        .mm-card-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px
        }

        .mm-rank {
            font-size: 1.1rem
        }

        .mm-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: white;
            flex-shrink: 0
        }

        .mm-card-body {
            flex: 1;
            min-width: 0
        }

        .mm-card-body h4 {
            font-size: .9rem;
            font-weight: 700;
            color: var(--navy);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .mm-meta {
            font-size: .75rem;
            color: var(--gray);
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin: 4px 0;
            align-items: center
        }

        .mm-jarak {
            color: var(--green-dark);
            font-weight: 600
        }

        .mm-status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: .72rem;
            color: var(--gray)
        }

        .mm-card-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex-shrink: 0
        }

        .mm-score-ring {
            width: 48px;
            height: 48px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .mm-score-ring svg {
            position: absolute;
            inset: 0;
            transform: rotate(-90deg);
            width: 100%;
            height: 100%
        }

        .mm-score-ring span {
            font-size: .7rem;
            font-weight: 800;
            color: var(--green-dark);
            position: relative;
            z-index: 1
        }

        .mm-btn-konsul {
            padding: 7px 16px;
            background: var(--green);
            color: white;
            border-radius: 50px;
            font-size: .78rem;
            font-weight: 700;
            transition: all var(--transition);
            white-space: nowrap
        }

        .mm-btn-konsul:hover {
            background: var(--green-dark)
        }

        .mm-btn-chat {
            padding: 7px 14px;
            background: transparent;
            color: var(--green-dark);
            border-radius: 50px;
            font-size: .75rem;
            font-weight: 700;
            transition: all var(--transition);
            white-space: nowrap;
            border: 2px solid var(--green)
        }

        .mm-btn-chat:hover {
            background: var(--green-light)
        }

        .mm-footer {
            padding: .8rem 0 0;
            border-top: 1px solid var(--gray-light);
            display: flex;
            gap: 10px;
            margin-top: .5rem
        }

        .btn-mm-retry {
            flex: 1;
            padding: 11px;
            background: var(--green-light);
            color: var(--green-dark);
            border-radius: 50px;
            font-weight: 700;
            font-size: .88rem;
            transition: all var(--transition);
            border: 2px solid var(--green);
            cursor: pointer
        }

        .btn-mm-retry:hover {
            background: var(--green);
            color: white
        }

        .section-dokter {
            padding: 3rem 2rem;
            max-width: 1100px;
            margin: 0 auto
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 1.7rem;
            font-weight: 900;
            color: var(--navy);
            margin-bottom: 2rem;
            position: relative;
            padding-bottom: 12px
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 48px;
            height: 4px;
            background: var(--green);
            border-radius: 2px
        }

        .dokter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem
        }

        .dokter-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 1.5rem;
            text-align: center;
            box-shadow: var(--shadow);
            transition: transform var(--transition)
        }

        .dokter-card:hover {
            transform: translateY(-4px)
        }

        .dokter-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            margin: 0 auto 12px
        }

        .dokter-card h3 {
            font-size: .97rem;
            font-weight: 700;
            color: var(--navy)
        }

        .dokter-card p {
            font-size: .82rem;
            color: var(--gray);
            margin: 4px 0 8px
        }

        .rating {
            font-size: .8rem;
            color: var(--dark);
            font-weight: 600
        }

        .btn-konsul {
            display: block;
            width: 100%;
            padding: 9px;
            background: var(--green-light);
            color: var(--green-dark);
            border-radius: 50px;
            font-weight: 700;
            font-size: .85rem;
            margin-top: 12px;
            transition: all var(--transition);
            cursor: pointer
        }

        .btn-konsul:hover {
            background: var(--green);
            color: white
        }

        @media(max-width:768px) {
            .navbar {
                padding: 0 1rem
            }

            .nav-links {
                display: none
            }

            .start-matchmaking {
                padding: 2rem 1.2rem
            }

            .start-matchmaking h3 {
                font-size: 1.25rem
            }

            .btn-sm-primary,
            .btn-sm-secondary {
                width: 100%;
                justify-content: center
            }

            .sm-trust {
                gap: 10px
            }

            .section-dokter {
                padding: 2rem 1rem
            }

            .modal {
                padding: 1.5rem 1rem;
                width: 95vw
            }

            .mm-card {
                flex-wrap: wrap;
                gap: 8px
            }

            .mm-card-right {
                flex-direction: row;
                width: 100%;
                justify-content: flex-end;
                gap: 8px
            }

            .dokter-grid {
                grid-template-columns: 1fr 1fr
            }
        }

        @media(max-width:540px) {
            .mm-card-body h4 {
                font-size: .82rem
            }

            .mm-meta {
                font-size: .7rem
            }

            .dokter-grid {
                grid-template-columns: 1fr
            }
        }

        /* ========== CHAT MODAL ========== */
        .chat-modal {
            width: 720px;

                </div>`;
                } else {
                    filtered = allDoctors;
                    reasonText = `
                <div style="text-align:center;padding:0.5rem 0;">
                    <span style="font-size:2rem;display:block;margin-bottom:8px;">📋</span>
                    <strong>Belum ada hasil Mind Check tersimpan</strong>
                    <p style="font-size:0.8rem;color:var(--gray);margin-top:4px;">Silakan lakukan <strong>Tes Mental</strong> terlebih dahulu untuk rekomendasi yang lebih akurat. Menampilkan semua dokter yang tersedia.</p>
                </div>`;
                }
            } else if (preference === 'psikolog') {
                filtered = allDoctors.filter(d => d.type === 'psikolog');
                reasonText = `
            <div style="display:flex;align-items:center;gap:10px;">
                <span style="font-size:1.8rem;">🗣️</span>
                <div><strong style="color:var(--green-dark);">Kamu memilih Psikolog</strong><br><span style="font-size:0.8rem;color:var(--gray);">Cocok untuk konseling, terapi bicara, dan dukungan mental non-obat.</span></div>
            </div>`;
            } else {
                filtered = allDoctors.filter(d => d.type === 'psikiater');
                reasonText = `
            <div style="display:flex;align-items:center;gap:10px;">
                <span style="font-size:1.8rem;">💊</span>
                <div><strong style="color:var(--green-dark);">Kamu memilih Psikiater</strong><br><span style="font-size:0.8rem;color:var(--gray);">Tepat untuk diagnosis klinis dan penanganan dengan terapi obat.</span></div>
            </div>`;
            }

            if (filtered.length === 0) filtered = allDoctors;

            const scored = filtered.map(d => {
                let score = 50 + d.rating * 8 - Math.min(d.distance * 2, 20) + (d.online ? 10 : 0) + Math.min(d.reviewCount / 5, 10);
                score += Math.floor(Math.random() * 8) - 4;
                return { ...d, score: Math.max(30, Math.min(98, Math.round(score))) };
            });

            scored.sort((a, b) => b.score - a.score);
            window._mmReasonText = reasonText;
            return scored;
        }

        function renderResults() {
            const reasonText = window._mmReasonText || '';
            const levelColor = window._mmLevelColor || '#f59e0b';

            let listHTML = '';
            const medals = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣', '6️⃣', '7️⃣', '8️⃣'];

            matchedDoctors.forEach((d, i) => {
                const isTop = i === 0;
                const circ = 2 * Math.PI * 20;
                const off = circ - (d.score / 100) * circ;
                listHTML += `
        <div class="mm-card ${isTop ? 'top-match' : ''}" onclick="openScheduleForDoctor(${d.id})">
          ${isTop ? '<span class="mm-top-badge">⭐ Rekomendasi Terbaik</span>' : ''}
          <div class="mm-card-left"><span class="mm-rank">${medals[i] || '👤'}</span><div class="mm-avatar" style="background:${d.avatarBg};color:white;">${d.avatarIcon}</div></div>
          <div class="mm-card-body">
            <h4>${d.name}</h4>
            <div class="mm-meta"><span style="background:#dbeafe;color:#1d4ed8;padding:2px 8px;border-radius:50px;font-size:0.7rem;font-weight:700;">${d.spesialis}</span><span>⭐ ${d.rating}</span><span class="mm-jarak">📍 ${d.distance} km</span></div>
            <div class="mm-status"><span style="width:8px;height:8px;border-radius:50%;background:${d.online ? 'var(--green)' : 'var(--gray)'};display:inline-block;"></span> ${d.online ? 'Online' : 'Offline'} · ${d.subSpesialis}</div>
          </div>
          <div class="mm-card-right">
            <div class="mm-score-ring"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="none" stroke="var(--gray-light)" stroke-width="5"/><circle cx="24" cy="24" r="20" fill="none" stroke="var(--green)" stroke-width="5" stroke-dasharray="${circ}" stroke-dashoffset="${off}" stroke-linecap="round"/></svg><span>${d.score}%</span></div>
            <button class="mm-btn-konsul" onclick="event.stopPropagation();openScheduleForDoctor(${d.id})"><i class="fa-solid fa-calendar-check"></i> Pesan</button>
            <button class="mm-btn-chat" onclick="event.stopPropagation();openChatForDoctor(${d.id})"><i class="fa-solid fa-comment-dots"></i> Chat</button>
          </div>
        </div>`;
            });

            return `
    <div class="mm-modal-header"><div><h3>✅ ${matchedDoctors.length} Dokter Ditemukan</h3><p>Berdasarkan ${selectedPreference === 'auto' ? 'hasil Mind Check & preferensi' : 'preferensi'} kamu</p></div></div>
    <div class="mm-result">
        <div class="mm-reason" style="background:${levelColor}10;border-color:${levelColor}30;">
            ${reasonText}
        </div>
        <div class="mm-list">${listHTML}</div>
    </div>
    <div class="mm-footer">
        <button class="btn-mm-retry" onclick="selectPreference(selectedPreference)"><i class="fa-solid fa-rotate"></i> Coba Lagi</button>
        <button class="btn-mm-retry" style="background:var(--gray-light);color:var(--mid);border-color:var(--gray-light);" onclick="openMatchmaking()"><i class="fa-solid fa-arrow-left"></i> Ganti Preferensi</button>
    </div>`;
        }

        function openScheduleForDoctor(doctorId) {
            const doctor = allDoctors.find(d => d.id === doctorId);
            if (!doctor) return;
            currentScheduleDoctor = doctor;
            document.getElementById('scheduleContent').innerHTML = `
    <h3>📅 Booking Konsultasi</h3><p>Dengan <strong>${doctor.name}</strong> — ${doctor.spesialis}</p>
    <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:6px;">Pilih Hari</label>
    <select class="jadwal-select" id="scheduleDay"><option value="">— Pilih Hari —</option>${doctor.schedule.map(s => `<option value="${s}">${s}</option>`).join('')}</select>
    <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:6px;">Pilih Jam</label>
    <div class="slot-grid" id="slotGrid">${doctor.timeSlots.map((t, i) => `<button class="slot-btn ${i >= doctor.timeSlots.length - 2 ? 'penuh' : ''}" data-slot="${t}" ${i >= doctor.timeSlots.length - 2 ? 'disabled' : ''}>${t} WIB ${i >= doctor.timeSlots.length - 2 ? '(Penuh)' : ''}</button>`).join('')}</div>
    <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:6px;">Jenis Konsultasi</label>
    <div class="jenis-grid"><label class="jenis-option selected"><input type="radio" name="jenisKonsul" value="online" checked hidden> 📹 Online</label><label class="jenis-option"><input type="radio" name="jenisKonsul" value="offline" hidden> 🏥 Offline</label></div>
    <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:6px;">Keluhan Singkat</label>
    <textarea class="jadwal-textarea" placeholder="Ceritakan singkat keluhanmu..."></textarea>
    <p style="font-size:0.78rem;color:var(--gray);margin-bottom:8px;">💰 Estimasi: <strong>${doctor.price}</strong></p>
    <button class="btn-book-submit" onclick="submitBooking()"><i class="fa-solid fa-paper-plane"></i> Konfirmasi Booking</button>`;
            openModal('scheduleModal', 'scheduleOverlay');
            attachSlotHandlers();
        }

        function closeSchedule() { currentScheduleDoctor = null; closeModal('scheduleModal', 'scheduleOverlay'); }

        function attachSlotHandlers() {
            document.querySelectorAll('#slotGrid .slot-btn:not(.penuh)').forEach(btn => {
                btn.addEventListener('click', function () {
                    document.querySelectorAll('#slotGrid .slot-btn').forEach(b => b.classList.remove('selected'));
                    this.classList.add('selected');
                });
            });
            document.querySelectorAll('.jenis-option').forEach(opt => {
                opt.addEventListener('click', function () {
                    document.querySelectorAll('.jenis-option').forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                    this.querySelector('input').checked = true;
                });
            });
        }

        function submitBooking() {
            const day = document.getElementById('scheduleDay')?.value;
            const slot = document.querySelector('#slotGrid .slot-btn.selected');
            const keluhan = document.querySelector('.jadwal-textarea')?.value;
            if (!day) return showToast('Pilih hari', 'error');
            if (!slot) return showToast('Pilih jam', 'error');
            if (!keluhan?.trim()) return showToast('Isi keluhan', 'error');
            const jenis = document.querySelector('input[name="jenisKonsul"]:checked')?.value === 'online' ? 'Online' : 'Offline';
            showToast(`✅ Booking berhasil! ${currentScheduleDoctor.name} — ${day}, ${slot.dataset.slot} WIB (${jenis})`, 'success');
            setTimeout(() => { closeSchedule(); if (mmState === 'results') closeMatchmaking(); }, 1500);
        }

        function openChatForDoctor(doctorId) {
            const doctor = allDoctors.find(d => d.id === doctorId);
            if (!doctor) return;
            currentChatDoctor = doctor;
            chatMessages = [
                { type: 'system', text: `Konsultasi dengan ${doctor.name} dimulai.` },
                { type: 'received', text: `Halo! Saya ${doctor.name}. Ada yang bisa saya bantu?`, time: 'Baru saja' }
            ];
            document.getElementById('chatContent').innerHTML = `
    <div class="chat-header">
        <div class="chat-avatar" style="background:${doctor.avatarBg};color:white;">${doctor.avatarIcon}</div>
        <div class="chat-header-info">
            <h4>${doctor.name}</h4>
            <span>${doctor.online ? '🟢 Online' : '⚫ Offline'} · ${doctor.spesialis}</span>
        </div>
        
        <button onclick="openFullChat('${doctor.id}')" title="Buka Chat Penuh" style="margin-right:8px;background:var(--green-light);color:var(--green-dark);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;">
            <i class="fa-solid fa-expand"></i>
        </button>
        
        <button style="width:32px;height:32px;border-radius:50%;background:var(--gray-light);display:flex;align-items:center;just-content:center;" onclick="closeChat()">
            <i class="fa-solid fa-times"></i>
        </button>
    </div>
    <div class="chat-messages" id="chatMessagesContainer"></div>
    <div class="chat-input-bar"><input type="text" id="chatInput" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="chat-send" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button></div>`;
            openModal('chatModal', 'chatOverlay');
            renderChatMessages();
            setTimeout(() => document.getElementById('chatInput')?.focus(), 400);
        }
        function openFullChat(doctorId) {
            localStorage.setItem('mindcheck_all_doctors', JSON.stringify(allDoctors));
            localStorage.setItem('mindcheck_active_chat_doctor', doctorId);
            window.open(`chat.html?dokter=${doctorId}`, '_blank');
        }
        function closeChat() { currentChatDoctor = null; chatMessages = []; closeModal('chatModal', 'chatOverlay'); }

        function renderChatMessages() {
            const c = document.getElementById('chatMessagesContainer');
            if (!c) return;
            c.innerHTML = chatMessages.map(msg => {
                if (msg.type === 'system') return `<div class="msg-system">${msg.text}</div>`;
                if (msg.type === 'sent') return `<div class="msg-row sent"><div class="msg-avatar-small" style="background:var(--green-dark);color:white;">👤</div><div><div class="msg-bubble">${msg.text}</div><div class="msg-time">${msg.time || ''}</div></div></div>`;
                return `<div class="msg-row received"><div class="msg-avatar-small" style="background:${currentChatDoctor?.avatarBg || 'var(--teal)'};color:white;">${currentChatDoctor?.avatarIcon || '👨‍⚕️'}</div><div><div class="msg-bubble">${msg.text}</div><div class="msg-time">${msg.time || ''}</div></div></div>`;
            }).join('');
            c.scrollTop = c.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            if (!input?.value.trim()) return;
            const text = input.value.trim();
            input.value = ''; input.disabled = true;
            const timeStr = new Date().toTimeString().slice(0, 5);
            chatMessages.push({ type: 'sent', text, time: timeStr });
            renderChatMessages();
            await sleep(1500);
            const replies = ['Terima kasih sudah berbagi.', 'Saya memahami.', 'Baik, saya catat.', 'Menarik, ceritakan lebih lanjut.', 'Itu penting untuk diperhatikan.'];
            chatMessages.push({ type: 'received', text: replies[Math.floor(Math.random() * replies.length)], time: timeStr });
            renderChatMessages();
            input.disabled = false; input.focus();
        }

        function renderDokterGrid() {
            const grid = document.getElementById('dokterGrid');
            if (!grid) return;
            grid.innerHTML = allDoctors.map(d => `
    <div class="dokter-card">
      <div class="dokter-img" style="background:${d.avatarBg};color:white;">${d.avatarIcon}</div>
      <h3>${d.name}</h3><p>${d.spesialis} · ${d.subSpesialis}</p>
      <p class="rating">⭐ ${d.rating} (${d.reviewCount}) · 📍 ${d.distance} km</p>
      <p style="font-size:0.75rem;color:var(--gray);">${d.online ? '🟢 Online' : '⚫ Offline'} · ${d.city}</p>
      <button class="btn-konsul" onclick="openScheduleForDoctor(${d.id})"><i class="fa-solid fa-calendar-check"></i> Booking</button>
      <button class="btn-konsul" style="background:transparent;border:2px solid var(--green);color:var(--green-dark);margin-top:6px;" onclick="openChatForDoctor(${d.id})"><i class="fa-solid fa-comment-dots"></i> Chat</button>
    </div>`).join('');
        }

        document.getElementById('mmOverlay').addEventListener('click', function (e) { if (e.target === this) closeMatchmaking(); });
        document.getElementById('scheduleOverlay').addEventListener('click', function (e) { if (e.target === this) closeSchedule(); });
        document.getElementById('chatOverlay').addEventListener('click', function (e) { if (e.target === this) closeChat(); });

        document.addEventListener('DOMContentLoaded', function () {
            renderDokterGrid();
            console.log('🧠 MindCheck Indonesia — Matchmaking Ready');
            console.log('   • ' + allDoctors.length + ' dokter tersedia');
            const tests = JSON.parse(localStorage.getItem('mindcheck_tests')) || [];
            console.log('   • ' + tests.length + ' hasil tes tersimpan di localStorage');
            if (tests.length > 0) {
                console.log('   • Tes terakhir: Skor ' + tests[0].totalScore + '/100, Level: ' + tests[0].level);
            }
        });
    </script>
</body>

</html>
